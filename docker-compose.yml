version: '3.8'

services:
  sketchtrace-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sketchtrace-ai-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=sketchtrace-super-secret-jwt-key-2026-hackathon
      - DEFAULT_AI_PROVIDER=pollinations
      # Optional: set your custom key if not using default Pollinations AI
      # - AI_API_KEY=your_key_here
    volumes:
      - sketchtrace-data:/app/server/data

volumes:
  sketchtrace-data:
    driver: local
